[workspace]
members = [
    "crates/hypaper-types",
    "crates/hypaper-scene",
    "crates/hypaper-renderer",
    "crates/hypaper-wayland",
    "crates/hypaper-hyprland",
    "crates/hypaper-daemon",
    "crates/hypaper-cli",
    "crates/hypaper-script",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HypaperEngine Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HypaperEngine/hypaper-engine"
rust-version = "1.75.0"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rmp-serde = "1"
serde_json = "1"
# Error handling
thiserror = "1"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
