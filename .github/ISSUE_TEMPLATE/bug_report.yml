name: Bug Report
description: Report a bug in Hypaper Engine
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How to reproduce the bug.
      placeholder: |
        1. Run `hypaperctl set ...`
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your system information.
      placeholder: |
        - OS: Arch Linux
        - Hyprland version: 0.40.0
        - Hypaper version: 0.1.0
        - GPU: AMD RX 6700
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs (`hypaperctl status --json`, daemon logs, etc.)
      render: shell
