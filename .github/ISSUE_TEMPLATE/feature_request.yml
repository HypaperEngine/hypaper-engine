name: Feature Request
description: Suggest a new feature for Hypaper Engine
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        For changes to the `.hyscene` format, please open a discussion in
        [hypaper-spec](https://github.com/HypaperEngine/hypaper-spec) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - scene / .hyscene format
        - renderer (wgpu)
        - wayland / layer-shell
        - hyprland integration
        - daemon / IPC
        - CLI (hypaperctl)
        - other
    validations:
      required: true
